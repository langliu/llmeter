[package]
name = "llmeter-app"
version.workspace = true
edition.workspace = true
publish.workspace = true
description = "Local-first AI coding usage tracker"

[package.metadata.bundle]
name = "LLMeter"
identifier = "io.github.langliu.llmeter"
icon = ["crates/llmeter-app/assets/AppIcon.icns"]
category = "Developer Tool"
short_description = "Local-first AI coding usage tracker"
long_description = "Track token usage from local AI coding agents without proxying traffic or uploading data."

[[bin]]
name = "llmeter"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
chrono.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
llmeter-collector = { path = "../llmeter-collector" }
llmeter-core = { path = "../llmeter-core" }
llmeter-storage = { path = "../llmeter-storage" }
rust-i18n.workspace = true
sys-locale.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
