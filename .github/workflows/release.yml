name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-macos:
    name: Build & Release (macOS Apple Silicon)
    runs-on: macos-14
    env:
      TARGET: aarch64-apple-darwin
      ARCH: macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: aarch64-apple-darwin

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Install cargo-bundle
        run: |
          if ! command -v cargo-bundle &> /dev/null; then
            cargo install cargo-bundle --locked
          fi

      - name: Build macOS App Bundle & Binary
        run: |
          cargo bundle --release --target $TARGET -p llmeter-app

      - name: Ad-hoc Code Sign App Bundle
        run: |
          # Ad-hoc sign bundle for Apple Silicon execution without paid cert
          codesign --force --deep -s - "target/$TARGET/release/bundle/osx/LLMeter.app"

      - name: Package Release Assets
        run: |
          APP_PATH="target/$TARGET/release/bundle/osx/LLMeter.app"

          # 1. Package DMG installer
          DMG_ROOT="dmg_root"
          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          cp -R "$APP_PATH" "$DMG_ROOT/"
          ln -s /Applications "$DMG_ROOT/Applications"
          hdiutil create -volname "LLMeter" -srcfolder "$DMG_ROOT" -ov -format UDZO "LLMeter-$ARCH.dmg"
          rm -rf "$DMG_ROOT"

          # 2. Package Zip archive for .app
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "LLMeter-$ARCH.zip"

          # 3. Package CLI tar.gz
          tar -czf "llmeter-cli-$ARCH.tar.gz" -C "target/$TARGET/release" llmeter

          # 4. Generate Checksums
          shasum -a 256 "LLMeter-$ARCH.dmg" > "LLMeter-$ARCH.dmg.sha256"
          shasum -a 256 "LLMeter-$ARCH.zip" > "LLMeter-$ARCH.zip.sha256"
          shasum -a 256 "llmeter-cli-$ARCH.tar.gz" > "llmeter-cli-$ARCH.tar.gz.sha256"

      - name: Upload Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          ASSETS=(
            "LLMeter-macos-arm64.dmg"
            "LLMeter-macos-arm64.dmg.sha256"
            "LLMeter-macos-arm64.zip"
            "LLMeter-macos-arm64.zip.sha256"
            "llmeter-cli-macos-arm64.tar.gz"
            "llmeter-cli-macos-arm64.tar.gz.sha256"
          )
          
          # Create release if it does not exist, or upload assets if already created
          gh release create "$TAG_NAME" \
            --title "$TAG_NAME" \
            --generate-notes \
            "${ASSETS[@]}" \
            || gh release upload "$TAG_NAME" "${ASSETS[@]}" --clobber

      - name: Update Homebrew Tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ inputs.tag_name || github.ref_name }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set. Skipping Homebrew Tap update."
            exit 0
          fi

          VERSION="${TAG_NAME#v}"
          SHA256=$(cat LLMeter-macos-arm64.zip.sha256 | awk '{print $1}')

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Clone tap repository
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/langliu/homebrew-tap.git" tap-repo
          cd tap-repo
          git checkout -B main

          mkdir -p Casks
          cat <<EOF > Casks/llmeter.rb
          cask "llmeter" do
            version "${VERSION}"
            sha256 "${SHA256}"
          
            url "https://github.com/langliu/llmeter/releases/download/v#{version}/LLMeter-macos-arm64.zip"
            name "LLMeter"
            desc "Local-first AI coding usage tracker"
            homepage "https://github.com/langliu/llmeter"
          
            livecheck do
              url :url
              strategy :github_latest
            end
          
            app "LLMeter.app"
          
            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-cr", "#{appdir}/LLMeter.app"],
                             sudo: false
            end
          
            zap trash: [
              "~/Library/Application Support/LLMeter",
              "~/Library/Saved Application State/io.github.langliu.llmeter.savedState",
            ]
          end
          EOF

          git add Casks/llmeter.rb
          if git diff --staged --quiet; then
            echo "No changes in Cask formula."
          else
            git commit -m "chore(cask): update llmeter to v${VERSION}"
            git push origin main
            echo "Successfully updated Homebrew Tap to v${VERSION}."
          fi
